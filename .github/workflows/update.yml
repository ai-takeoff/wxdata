name: Update forecast data

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 minutes (odd minutes avoid the top-of-hour rush)
  workflow_dispatch:               # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                   # lets the job keep its own schedule enabled

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: wxstate-${{ github.run_id }}
          restore-keys: wxstate-

      - name: Fetch and process new model output
        id: pipeline
        env:
          WX_TIME_BUDGET: "2100"     # stop starting new work after 35 min
        run: |
          python -m pipeline.run --data state/data --work state/work | tee run.log
          grep -q "CHANGED=true" run.log && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: wxstate-${{ github.run_id }}

      - name: Assemble site
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -al state/data _site/data
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        # GitHub disables schedules in repos with no activity for 60 days; re-enabling daily prevents that.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
          fi
