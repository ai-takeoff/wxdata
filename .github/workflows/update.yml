name: Update forecast data

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 minutes (odd minutes avoid the top-of-hour rush)
  workflow_dispatch:               # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write                  # publishes run logs to the 'status' branch
  pages: write
  id-token: write
  actions: write                   # lets the job keep its own schedule enabled

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: wxstate-${{ github.run_id }}
          restore-keys: wxstate-

      - name: Fetch and process new model output
        id: pipeline
        env:
          WX_TIME_BUDGET: "2100"     # stop starting new work after 35 min
        run: |
          python -m pipeline.run --data state/data --work state/work | tee run.log
          grep -q "CHANGED=true" run.log && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: wxstate-${{ github.run_id }}

      - name: Assemble site
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -al state/data _site/data
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pipeline.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Publish run status
        # Log tail + data summary on the 'status' branch, readable without signing in.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/st && cd /tmp/st
          {
            echo "run: ${{ github.run_number }} (${{ github.event_name }})  $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "pipeline: ${{ steps.pipeline.outcome }}  deploy: ${{ steps.deploy.outcome }}/${{ steps.deploy2.outcome }}"
            echo "data size: $(du -sh "$GITHUB_WORKSPACE/state/data" 2>/dev/null | cut -f1)"
            du -sh "$GITHUB_WORKSPACE"/state/data/*/* 2>/dev/null || true
          } > summary.txt
          tail -n 400 "$GITHUB_WORKSPACE/run.log" > log.txt 2>/dev/null || echo "no log" > log.txt
          cp "$GITHUB_WORKSPACE/state/data/index.json" . 2>/dev/null || true
          git init -q -b status
          git -c user.name=wxdata-bot -c user.email=actions@users.noreply.github.com add -A
          git -c user.name=wxdata-bot -c user.email=actions@users.noreply.github.com commit -qm "status ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" status || true

      - name: Keep the schedule alive
        # GitHub disables schedules in repos with no activity for 60 days; re-enabling daily prevents that.
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
          fi
